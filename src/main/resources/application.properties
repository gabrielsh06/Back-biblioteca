spring.application.name=Back-Biblioteca

# Port configuration (Render assigns the port via the PORT env var, defaults to 8080 locally)
server.port=${PORT:8080}

# Database Configuration (supports Render PostgreSQL environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/biblioteca_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:default-secret-key-that-must-be-at-least-256-bits-long-back-biblioteca-super-secure}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration (Origins separados por coma o * para desarrollo)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
